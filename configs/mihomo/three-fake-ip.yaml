# three-fake-ip.yaml
# 三机场（stable / stable1 / cheap）+ 自建规则例外分流 + MetaCubeX 上游（GEOSITE / GEOIP 内联）的 fake-ip 版。
# 与 three-redir-host.yaml 是**孪生配置：策略组/规则/规则集完全一致，只有 DNS 模式不同**，
# 改一份要同步另一份。手机（FlClash）/ TUN 场景推荐用这一份：
# 客户端拿到的是假 IP，不携带污染信息，连接时用域名出站、由节点解析——
# 既不依赖「境外 DoH 能否直连」，也不怕本地解析被污染。本文件不依赖本机 127.0.0.1:5225。
# 使用前必须把下面三个 url: "订阅" 替换为真实订阅地址。

proxy-providers:
  # 三个机场共用同一套设置，只在这里定义一次，下面三个 provider 用锚点继承；
  # 只有 additional-prefix 和 url 各自写。
  #   · health-check.interval：fallback 组的切换灵敏度完全取决于它；
  #   · lazy: true —— 只有该机场被实际使用时才做健康检查（省电省流量），
  #     代价是切到久未使用的机场时，头几秒的存活状态可能还是过期的；
  #   · 某个机场的订阅必须经代理才能拉到时，删掉它那行 `proxy: DIRECT`（就会改成按规则走）。
  stable: &provider_base
    type: http
    interval: 86400
    proxy: DIRECT
    header:
      User-Agent:
        - clash.meta
    health-check:
      enable: true
      url: "https://www.gstatic.com/generate_204"
      timeout: 3000
      interval: 120
      lazy: true
    exclude-filter: "超时|重置|机场|直连|优惠|官方|官网|到期|配置|更新|佣金|订阅|BT|流量|游戏|消耗"
    override:
      additional-prefix: "渔云|"
    url: "订阅"

  stable1:
    <<: *provider_base
    override:
      additional-prefix: "猫咪|"
    url: "订阅"

  cheap:
    <<: *provider_base
    override:
      additional-prefix: "一分|"
    url: "订阅"
global-ua: clash.meta

# 只留混合端口（http+socks 都有）；redir/tproxy 是 Linux 专用，Windows/安卓/客户端里通常也会被覆盖
mixed-port: 7893
ipv6: false
allow-lan: false
tcp-concurrent: true

geodata-mode: false
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geosite: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geosite.dat"
  mmdb: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.metadb"
  geoip: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/geoip-lite.dat"
  asn: "https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@release/GeoLite2-ASN.mmdb"

# Clash Party 使用自己的面板；控制接口只监听本机，避免无密码暴露到局域网。
external-controller: 127.0.0.1:9090
secret: ""

find-process-mode: strict
keep-alive-idle: 600
keep-alive-interval: 30

profile:
  store-selected: true
  # fake-ip 模式下持久化「假 IP ↔ 域名」映射（重启后应用缓存的旧假 IP 仍能对上）；redir-host 下这项无意义，保留是为了两份结构一致
  store-fake-ip: true

sniffer:
  enable: true
  # 用嗅探到的域名改写连接目标（默认值就是 true，这里写明；关掉则只参与规则匹配、出站仍用原 IP）
  override-destination: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      # 补上 Cloudflare 的备用 HTTPS 端口，让更多连接能靠 SNI 把域名救回来
      ports: [443, 8443, 2053, 2083, 2087, 2096]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - "+.v2ex.com"
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.media.dssott.com"
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"

# 保留 TUN，但使用常见 MTU；Clash Party 也可以只用系统代理，不需要手动改规则。
tun:
  enable: true
  stack: mixed
  mtu: 1500
  gso: false
  endpoint-independent-nat: false
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true

# ── DNS 上游：同一组 DoH 地址在多处复用，只在这里定义一次 ──
x-dns-lists:
  cn:   &cn_dns   ["https://dns.alidns.com/dns-query", "https://doh.pub/dns-query"]
  intl: &intl_dns ["https://dns.cloudflare.com/dns-query", "https://dns.google/dns-query"]

dns:
  enable: true
  # 只监听本机：TUN 的 dns-hijack 是把连接导入内部 DNS 模块，不依赖这个端口；
  # 哪天要给局域网设备当 DNS 用，再改回 0.0.0.0
  listen: 127.0.0.1:1053
  ipv6: false
  enhanced-mode: fake-ip
  # IANA 保留的测试段（不要写 28.0.0.1/8 那种真实公网段）
  fake-ip-range: 198.18.0.1/16
  # blacklist：下面列表里的域名发真实 IP，其余全部发假 IP（假 IP 不需要解析，也就没有污染问题）
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - geosite:private
    - geosite:cn                 # 国内域名必须真实 IP 才能直连
    # 必须拿到真实 IP 的常见例外：连通性检测 / 推送 / 联机游戏 / 时间同步
    - "+.msftconnecttest.com"
    - "+.msftncsi.com"
    - "+.push.apple.com"
    - "+.ntp.org"
    - "+.stun.playstation.net"
    - "+.srv.nintendo.net"
    - "+.xboxlive.com"
    - localhost.ptlogin2.qq.com
  respect-rules: true
  default-nameserver: [223.5.5.5, 114.114.114.114]
  proxy-server-nameserver: *cn_dns
  direct-nameserver: *cn_dns
  direct-nameserver-follow-policy: false
  nameserver: *cn_dns
  fallback: *intl_dns
  # 显式写出（与默认值一致）：「主解析结果不是中国 IP」就改问 fallback——
  # 国内 DoH 对境外域名会返回污染 IP，这条判断正是挡住它的关键
  fallback-filter: {geoip: true, geoip-code: CN}
  fallback-lazy-query: true
  nameserver-policy:
    "geosite:cn,private": *cn_dns
    "geosite:geolocation-!cn": *intl_dns

# ── 节点筛选词：只在这里定义一次，下面各策略组用 YAML 锚点引用 ──
# （mihomo 不认识 x-node-filters 这个键，会忽略它；它只是给锚点一个落脚处。
#   改筛选词只需改这里，下面各策略组的 filter 都会跟随，不会出现"链上过滤了、手动列表没过滤"的漂移。）
x-node-filters:
  no_hktw: &no_hktw "(?i)^((?!(香港|港|HK|Hong Kong|HongKong|台湾|台灣|Taiwan|TW|台北|台中|台南|高雄|新北|桃园|桃園|彰化|中华电信|中華電信|HiNet|剩余|流量|套餐|有效期|过期|试用|测试|维护)).)*$"
  no_jp:   &no_jp   "(?i)^((?!(日|JP|Japan|Tokyo|Osaka|东京|大阪|名古屋|福冈|札幌|横滨|神户|京都|冲绳|埼玉|琦玉|家宽|游戏|剩余|流量|套餐|有效期|过期|试用|测试|维护)).)*$"
  # 港台（正向）：只收香港 / 台湾节点，给「📺 B站番剧」用。与 no_hktw 是同一套词的正面写法
  # （繁体写法两边都收，避免节点名写「台灣-01」时两个组判断不一致）
  hktw:    &hktw    "(?i)(香港|港|HK|Hong Kong|HongKong|台湾|台灣|Taiwan|TW|台北|台中|台南|高雄|新北|桃园|桃園|彰化|中华电信|中華電信|HiNet)"

proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [🔯 自动兜底, 🔯 主备切换, 🔯 主备切换1, ♻️ 便宜主备], include-all: true}
  - {name: 🤖 AI, type: select, proxies: [🔯 主备切换|非港台, 🔯 主备切换|非港台1], include-all: true, filter: *no_hktw}
  # 游戏不做地区限制：港澳台节点延迟低，打游戏反而更合适，所以候选直接用不限地区的链
  - {name: 🎮 游戏, type: select, proxies: [🔯 主备切换, 🔯 主备切换1], include-all: true}
  - {name: 🎌 漫画动漫, type: select, proxies: [🔯 主备切换|非日本, 🔯 主备切换|非日本1], include-all: true, filter: *no_jp}
  # e-hentai 单独成组：图站的下载额度按 IP 记，换机场 / 换节点都在这里切；
  # 候选与「🎌 漫画动漫」同源（非日本链 + 全机场非日本节点，默认项就是非日本链）
  - {name: 🔞 e-hentai, type: select, proxies: [🔯 主备切换|非日本, 🔯 主备切换|非日本1, ♻️ 便宜主备], include-all: true, filter: *no_jp}
  # 微软服务默认直连：Windows 更新 / Office 下载走直连更快，也避免影响「手机连接」的局域网配对
  - {name: 🪟 微软服务, type: select, proxies: [DIRECT, 🚀 节点选择]}
  - {name: 🎬 流媒体, type: select, proxies: [♻️ 便宜主备, 🚀 节点选择], use: [cheap]}
  # B站番剧默认直连（与不加规则时完全一致）；要看港澳台限定番剧，把这一组切到「港澳台」链
  - {name: 📺 B站番剧, type: select, proxies: [DIRECT, 🔯 主备切换|港澳台, 🔯 主备切换|港澳台1], include-all: true, filter: *hktw}
  - {name: ✈️ Speedtest, type: select, proxies: [🔯 主备切换, 🔯 主备切换1, ♻️ 便宜主备], include-all: true}

  # 跨机场自动：stable → stable1 → cheap。想指定某个机场就别选它，
  # 在上一行的「🚀 节点选择」里改选对应的单机场链：🔯 主备切换 / 🔯 主备切换1 / ♻️ 便宜主备
  - {name: 🔯 自动兜底, type: fallback, proxies: [🔯 主备切换, 🔯 主备切换1, ♻️ 便宜主备], url: "https://www.gstatic.com/generate_204", interval: 300, max-failed-times: 1}
  - {name: ♻️ 便宜主备, type: fallback, use: [cheap], url: "https://www.gstatic.com/generate_204", interval: 300, max-failed-times: 1}

  # 机场一：stable —— 四条链，按地区区分（无限制 / 非港台 / 非日本 / 港澳台）
  - {name: 🔯 主备切换, type: fallback, use: [stable], url: "https://www.gstatic.com/generate_204", interval: 300, max-failed-times: 1}
  - {name: 🔯 主备切换|非港台, type: fallback, use: [stable], url: "https://www.gstatic.com/generate_204", interval: 300, filter: *no_hktw, max-failed-times: 1}
  - {name: 🔯 主备切换|非日本, type: fallback, use: [stable], url: "https://www.gstatic.com/generate_204", interval: 300, filter: *no_jp, max-failed-times: 1}
  - {name: 🔯 主备切换|港澳台, type: fallback, use: [stable], url: "https://www.gstatic.com/generate_204", interval: 300, filter: *hktw, max-failed-times: 1}

  # 机场二：stable1 —— 同上
  - {name: 🔯 主备切换1, type: fallback, use: [stable1], url: "https://www.gstatic.com/generate_204", interval: 300, max-failed-times: 1}
  - {name: 🔯 主备切换|非港台1, type: fallback, use: [stable1], url: "https://www.gstatic.com/generate_204", interval: 300, filter: *no_hktw, max-failed-times: 1}
  - {name: 🔯 主备切换|非日本1, type: fallback, use: [stable1], url: "https://www.gstatic.com/generate_204", interval: 300, filter: *no_jp, max-failed-times: 1}
  - {name: 🔯 主备切换|港澳台1, type: fallback, use: [stable1], url: "https://www.gstatic.com/generate_204", interval: 300, filter: *hktw, max-failed-times: 1}

  - {name: 🎯 全球直连, type: select, proxies: [DIRECT, 🚀 节点选择]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 节点选择, 🔯 主备切换, 🔯 主备切换1, ♻️ 便宜主备, 🎯 全球直连]}

rule-providers:
  # ══ 自建清单：手工源是 rules/*.list（唯一手改的地方）══
  # 每个清单拆成两半，都由 scripts/gen_mrs.py 从源清单生成：
  #   mrs/<同名>.mrs       域名部分（DOMAIN / DOMAIN-SUFFIX）——走索引查找，不再逐条扫描
  #   rules/<同名>.rest.list  mrs 表达不了的部分（DOMAIN-KEYWORD / IP-CIDR 等）——仍是 classical 文本
  # `*_rest` 紧挨着它对应的 mrs、指向同一个组，所以拆开不改变命中结果。
  ai: &domain
    proxy: DIRECT
    type: http
    interval: 86400
    behavior: domain
    format: mrs
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/AI.mrs"
  ai_rest: &self_text
    proxy: DIRECT
    type: http
    interval: 86400
    behavior: classical
    format: text
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/rules/AI.rest.list"
  anime_cn:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/AnimeCN.mrs"
  anime_proxy:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/AnimeProxy.mrs"
  anime_proxy_rest:
    <<: *self_text
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/rules/AnimeProxy.rest.list"
  bluearchive:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/BlueArchive.mrs"
  bluearchive_rest:
    <<: *self_text
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/rules/BlueArchive.rest.list"
  manga_cn:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/MangaCN.mrs"
  manga_cn_rest:
    <<: *self_text
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/rules/MangaCN.rest.list"
  manga_proxy_no_eh:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/MangaProxyNoEH.mrs"
  manga_proxy_no_eh_rest:
    <<: *self_text
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/rules/MangaProxyNoEH.rest.list"
  manga_ehentai:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/MangaEHentai.mrs"
  manga_ehentai_rest:
    <<: *self_text
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/rules/MangaEHentai.rest.list"
  media:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/Media.mrs"
  # B站系域名（直连）：引用上游 blackmatrix7 的 BiliBili 清单，比手工维护的那 6 行更全——
  # 含全部 CDN / PCDN 主机、四个 akamai 镜像（其中 upos-hz-mirrorakam 是港澳台番剧的海外 UPOS，
  # 直连更快）、App 包名等，并随上游更新。港澳台判定那几个域名由 bilibili_hmt 优先接管。名字里的 CDN 是重点：真正依赖这条规则的
  # 是 CDN / PCDN / 镜像主机（其余 B站域名 geosite cn 本来也会直连）。
  bilibili_cdn:
    proxy: DIRECT
    type: http
    interval: 86400
    behavior: classical
    format: text
    url: "https://cdn.jsdelivr.net/gh/blackmatrix7/ios_rule_script@master/rule/Clash/BiliBili/BiliBili.list"
  bilibili_hmt:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/BiliBiliHMT.mrs"
  proxylite:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/ProxyLite.mrs"
  direct1:
    <<: *domain
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/mrs/DirectOwn.mrs"
  download:
    <<: *self_text
    url: "https://cdn.jsdelivr.net/gh/jldxnb/openclash-rules@main/rules/download.list"

rules:
  # 私网 / 组播地址一律直连：命不中前面任何规则的局域网 IP 会一路落到 MATCH → 🐟 漏网之鱼 →
  # 被送进代理（路由器后台、打印机、NAS、投屏用的 mDNS/SSDP、「手机连接」都会受影响）。
  # cn_ip 那份 GeoIP 里不含 RFC1918 网段，所以必须显式写。
  - IP-CIDR,10.0.0.0/8,DIRECT,no-resolve
  - IP-CIDR,172.16.0.0/12,DIRECT,no-resolve
  - IP-CIDR,192.168.0.0/16,DIRECT,no-resolve
  - IP-CIDR,169.254.0.0/16,DIRECT,no-resolve
  - IP-CIDR,100.64.0.0/10,DIRECT,no-resolve
  - IP-CIDR,224.0.0.0/4,DIRECT,no-resolve
  # 连本机 → 直连。原来这条在 rules/DirectOwn.rest.list 里，整份只剩这一行，
  # 没必要为了它去拉远程规则集，直接写进配置。
  - IP-CIDR,127.0.0.1/32,DIRECT,no-resolve

  # 自建规则：顺序是例外优先（manga_ehentai 早于 manga_proxy_no_eh，保证 e-hentai 落「🔞 e-hentai」组；
  # anime_proxy 排在 B站 规则之后，避免抢走 B站国际版域名与 CDN 直连）。
  # 每对「X + X_rest」来自同一个清单：X 是 mrs（域名部分），X_rest 是关键词/IP 部分（source list 里 mrs 编不进去的条目）。
  - RULE-SET,direct1,DIRECT
  - RULE-SET,ai,🤖 AI
  - RULE-SET,ai_rest,🤖 AI
  - RULE-SET,bluearchive,🎮 游戏
  - RULE-SET,bluearchive_rest,🎮 游戏
  - RULE-SET,manga_cn,🎯 全球直连
  - RULE-SET,manga_cn_rest,🎯 全球直连
  # e-hentai 单独走组（图站额度按 IP 记，换机场 / 换节点最方便）：
  # 排在 manga_proxy 之前，避免被漫画清单先接走
  - RULE-SET,manga_ehentai,🔞 e-hentai
  - RULE-SET,manga_ehentai_rest,🔞 e-hentai
  - RULE-SET,manga_proxy_no_eh,🎌 漫画动漫
  - RULE-SET,manga_proxy_no_eh_rest,🎌 漫画动漫
  - RULE-SET,media,🎌 漫画动漫
  # B站：先让「📺 B站番剧」（可切换、默认直连）接管地区判定 / 播放入口 + 国际版，
  # 再由 bilibili_cdn（上游清单）兜住 CDN / PCDN 等其余 B站系域名，保持直连。
  # 顺序不能反：反了 +.bilibili.com 会先把 api/bangumi 接走，📺 组就切不动了。
