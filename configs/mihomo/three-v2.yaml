  # ══ 成熟上游：去广告合并规则（217heidai，16 个源合并，8 小时一更，约 5200 条）══
  adblock: { <<: *class, url: "https://raw.githubusercontent.com/217heidai/adblockfilters/main/rules/adblockclashlite.list" }

  # ══ 成熟上游：MetaCubeX geosite / geoip（mrs 格式，最省内存）══
