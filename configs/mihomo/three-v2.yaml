  manga_cn:    { <<: *class, url: "https://raw.githubusercontent.com/jldxnb/openclash-rules/main/rules/MangaCN.list" }
  manga_proxy: { <<: *class, url: "https://raw.githubusercontent.com/jldxnb/openclash-rules/main/rules/MangaProxy.list" }
  bluearchive: { <<: *class, url: "https://raw.githubusercontent.com/jldxnb/openclash-rules/main/rules/BlueArchive.list" }
  media:       { <<: *class, url: "https://raw.githubusercontent.com/jldxnb/openclash-rules/main/rules/Media.list" }
