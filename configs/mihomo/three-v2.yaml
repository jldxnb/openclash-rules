# three-v2.yaml：three.yaml 的「成熟上游规则 + 自建特殊规则」混合版
#   · 自建规则：rules/ 下你自己维护的 11 个列表，全部放在规则最前面做例外分流
#   · 成熟上游：MetaCubeX geosite/geoip（mrs 格式，内存占用最小）+ 217heidai 去广告合并规则
#   · 与 three.yaml 的区别仅限「规则来源」和新增的「🇯🇵 日本节点」组；策略组结构、DNS、
#     TUN、sniffer 等设置完全一致，两个文件可互换使用
#
# 机场订阅，名称不能重复
proxy-providers:
  stable:
    type: http
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      timeout: 3000
      # 健康检查间隔：原为 300（5 分钟），fallback 组的切换灵敏度完全取决于它
      interval: 120
      # 不使用该机场时也要测：否则切到久未使用的机场时，节点"存活状态"是过期的
      lazy: false
    override:
      skip-cert-verify: true
      additional-prefix: "渔云|"
    exclude-filter: "超时|重置|机场|直连|优惠|官方|官网|到期|配置|更新|佣金|订阅|BT|流量|游戏|消耗|0.1|0.5|5x|x8|x3"
    url: "订阅"

  stable1:
    type: http
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      timeout: 3000
      # 健康检查间隔：原为 300（5 分钟），fallback 组的切换灵敏度完全取决于它
      interval: 120
      # 不使用该机场时也要测：否则切到久未使用的机场时，节点"存活状态"是过期的
      lazy: false
    override:
      skip-cert-verify: true
      additional-prefix: "猫咪|"
    exclude-filter: "超时|重置|机场|直连|优惠|官方|官网|到期|配置|更新|佣金|订阅|BT|流量|游戏|消耗|0.1|0.5|5x|x8|x3"
    url: "订阅"

  cheap:
    type: http
    interval: 86400
    proxy: DIRECT
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      timeout: 3000
      # 健康检查间隔：原为 300（5 分钟），fallback 组的切换灵敏度完全取决于它
      interval: 120
      # 不使用该机场时也要测：否则切到久未使用的机场时，节点"存活状态"是过期的
      lazy: false
    override:
      skip-cert-verify: true
      additional-prefix: "一分|"
    exclude-filter: "超时|重置|机场|直连|优惠|官方|官网|到期|配置|更新|佣金|订阅|BT|流量|游戏|消耗|0.1|0.5|5x|x8|x3"
    url: "订阅"

# 用于下载订阅时指定UA
global-ua: clash.meta
    
# 全局配置
port: 7890
socks-port: 7891
redir-port: 7892
mixed-port: 7893
tproxy-port: 7894
ipv6: true
allow-lan: true
#unified-delay: true
tcp-concurrent: true
# interface-name: eth0  （路由器下根据情况指定出站接口）
authentication:
  - name:passwd
  
geodata-mode: false
# GEO 加载器不显式设置：mihomo 默认 memconservative（官方定位为低内存设备优化）
geo-auto-update: true
geo-update-interval: 48
geox-url:
  geosite: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geosite.dat"
  mmdb: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.metadb"
  geoip: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/geoip-lite.dat"
  asn: "https://github.com/MetaCubeX/meta-rules-dat/releases/download/latest/GeoLite2-ASN.mmdb"
  
# 控制面板
external-controller: 0.0.0.0:9090
secret: ""
external-ui: ui
external-ui-url: "https://github.com/MetaCubeX/metacubexd/archive/refs/heads/gh-pages.zip"
# 下载面板地址可更换：https://github.com/MetaCubeX/Yacd-meta/archive/gh-pages.zip

# 匹配进程 always/strict/off
find-process-mode: strict
keep-alive-idle: 600
keep-alive-interval: 30

# 策略组选择和fakeip缓存
profile:
  store-selected: true
  store-fake-ip: true
  
# 流量嗅探
sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - +.v2ex.com
    - "+.netflix.com"
    - "+.nflxvideo.net"
    - "+.amazonaws.com"
    - "+.media.dssott.com"
  skip-domain:
    - "Mijia Cloud"
    - "dlg.io.mi.com"
    - "+.push.apple.com"
    - "+.apple.com"
    
# 代理模式
tun:
  enable: true
  stack: mixed
  mtu: 9000
  gso: true
  gso-max-size: 65536
  endpoint-independent-nat: false
  dns-hijack:
    - "any:53"
    - "tcp://any:53"
  auto-route: true
  auto-redirect: true
  auto-detect-interface: true
  
# DNS模块
dns:
  enable: true
  listen: 0.0.0.0:1053
  ipv6: true
  respect-rules: true
  # 模式切换 redir-host / fake-ip
  enhanced-mode: fake-ip
  fake-ip-range: 28.0.0.1/8
  # 模式切换 whitelist/blacklist 
  # 黑名单模式表示如果匹配成功则不返回 Fake-IP, 白名单模式时只有匹配成功才返回 Fake-IP
  fake-ip-filter-mode: blacklist
  fake-ip-filter:
    - "+.lan"
    - "+.local"
    - geosite:private
    - geosite:cn
  default-nameserver:
    - 223.5.5.5
    - 114.114.114.114
  proxy-server-nameserver:
    - https://dns.alidns.com/dns-query
    - https://doh.pub/dns-query
  direct-nameserver:
    - 127.0.0.1:5225
  nameserver:
    - 127.0.0.1:5225
  fallback:
    - https://dns.cloudflare.com/dns-query
    - https://dns.google/dns-query
  nameserver-policy:
    geosite:cn,private:
      - https://dns.alidns.com/dns-query
      - https://doh.pub/dns-query
    geosite:geolocation-!cn:
      - https://dns.cloudflare.com/dns-query
      - https://dns.google/dns-query
 
  
# 策略组
proxy-groups:
  - {name: 🚀 节点选择, type: select, proxies: [🔯 自动兜底, 🔯 主备切换, 🔯 主备切换1, ♻️ 便宜主备], include-all: true}
  - {name: 🎮 日美等节点, type: select, proxies: [🔯 主备切换|日美等, 🔯 主备切换|日美等1], include-all: true, filter: "^((?!(香港|HK|Hong Kong|🇭🇰|HongKong|台湾|TW)).)*$" }
  - {name: 🎞️ 非日本节点, type: select, proxies: [🔯 主备切换|非日, 🔯 主备切换|非日1], include-all: true, filter: "^((?!(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)).)*$" }
  - {name: 🇯🇵 日本节点, type: select, proxies: [🔯 主备切换|日, 🔯 主备切换|日1], include-all: true, filter: "(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))^((?!(家宽|游戏|剩余|流量|2.0|3.0|4.0)).)*$" }
  - {name: 🎬 流媒体, type: select, proxies: [♻️ 便宜主备, 🚀 节点选择], use: [cheap]}
  - {name: ✈️ Speedtest, type: select, proxies: [🔯 主备切换, 🔯 主备切换1, ♻️ 便宜主备], include-all: true}
  - {name: 🛑 广告拦截, type: select, proxies: [REJECT, DIRECT]}
  

  # 以下自动组均为 fallback：默认用列表里第一个健康的节点，可以在面板里手动指定节点
  # （选择会随 store-selected 持久化），指定的节点失效时自动切到下一个健康的节点。
  # 与 url-test 的区别：不会再为了"快几毫秒"频繁换节点，连接更稳定；代价是失效检测
  # 依赖健康检查周期（interval），切换不是瞬时的。
  # 跨机场兜底：stable 整体不可用时自动切到 stable1，再不行才用 cheap
  - {name: 🔯 自动兜底, type: fallback, proxies: [🔯 主备切换, 🔯 主备切换1, ♻️ 便宜主备], url: "https://www.gstatic.com/generate_204", interval: 300, max-failed-times: 1}
  - {name: ♻️ 便宜主备, type: fallback, use: [cheap], url: "https://www.gstatic.com/generate_204", interval: 300, max-failed-times: 1}
  - {name: 🔯 主备切换, type: fallback, use: [stable], url: "https://www.gstatic.com/generate_204", interval: 300, max-failed-times: 1}
  - {name: 🔯 主备切换|日美等, type: fallback, use: [stable], url: "https://www.gstatic.com/generate_204", interval: 300, filter: "^((?!(香港|HK|Hong Kong|🇭🇰|HongKong|台湾|TW)).)*$", max-failed-times: 1}
  - {name: 🔯 主备切换|非日, type: fallback, use: [stable], url: "https://www.gstatic.com/generate_204", interval: 300, filter: "^((?!(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)).)*$", max-failed-times: 1}
  - {name: 🔯 主备切换1, type: fallback, use: [stable1], url: "https://www.gstatic.com/generate_204", interval: 300, max-failed-times: 1}
  - {name: 🔯 主备切换|日美等1, type: fallback, use: [stable1], url: "https://www.gstatic.com/generate_204", interval: 300, filter: "^((?!(香港|HK|Hong Kong|🇭🇰|HongKong|台湾|TW)).)*$", max-failed-times: 1}
  - {name: 🔯 主备切换|非日1, type: fallback, use: [stable1], url: "https://www.gstatic.com/generate_204", interval: 300, filter: "^((?!(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan)).)*$", max-failed-times: 1}
  - {name: 🔯 主备切换|日, type: fallback, use: [stable], url: "https://www.gstatic.com/generate_204", interval: 300, filter: "(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))^((?!(家宽|游戏|剩余|流量|2.0|3.0|4.0)).)*$", max-failed-times: 1}
  - {name: 🔯 主备切换|日1, type: fallback, use: [stable1], url: "https://www.gstatic.com/generate_204", interval: 300, filter: "(?=.*(日本|川日|东京|大阪|泉日|埼玉|沪日|深日|JP|Japan))^((?!(家宽|游戏|剩余|流量|2.0|3.0|4.0)).)*$", max-failed-times: 1}


  - {name: 🎯 全球直连, type: select, proxies: [DIRECT, 🚀 节点选择]}
  - {name: 🐟 漏网之鱼, type: select, proxies: [🚀 节点选择, 🎯 全球直连]}
rules:
  # ══ 自建规则：放在最前，靠顺序优先命中做例外分流 ══
  - RULE-SET,direct1,DIRECT                  # 直连补充（immortalwrt 源 / 漫画 / 555电影 / AGE动漫）
  - RULE-SET,ai,🎮 日美等节点                 # AI 清单（自建，优先于下面的 category-ai-!cn）
  - RULE-SET,no_jp,🎞️ 非日本节点              # 不能走日本节点的站点
  - RULE-SET,bluearchive,🎮 日美等节点         # 蔚蓝档案
  - RULE-SET,manga_cn,🎯 全球直连              # 漫画清单 MangaCN：国内可直连的漫画站
  - RULE-SET,manga_proxy,🚀 节点选择           # 漫画清单 MangaProxy：需代理的漫画站（顶替原 japan_manga / japan_anime）
  - RULE-SET,media,🚀 节点选择                # 影视站（missav / xvideos）
  - RULE-SET,bilibili,🎯 全球直连             # B 站 CDN 直连加速
  - RULE-SET,proxylite,DIRECT                # 机场官网（渔云 / 一分机场）直连，代理挂了也能打开
  - RULE-SET,download,🎯 全球直连             # 下载器进程直连（需进程匹配，移动端可能不生效）

  # ══ 成熟上游规则 ══
  # 去广告（把「🛑 广告拦截」组切到 DIRECT 即全部放行）
  - RULE-SET,adblock,🛑 广告拦截              # 217heidai 合并规则
  - RULE-SET,ai_all,🎮 日美等节点             # MetaCubeX category-ai-!cn（20+ AI 服务类别）

  - RULE-SET,private_domain,DIRECT
  - RULE-SET,apple_domain,🎯 全球直连
  # 国内可直连的 Google 域名，必须排在 google_domain 之前，否则不会生效
  - RULE-SET,google_cn,🎯 全球直连
  - RULE-SET,github_domain,🚀 节点选择
  - RULE-SET,youtube_domain,🎬 流媒体
  - RULE-SET,twitter_domain,🎬 流媒体
  - RULE-SET,google_domain,🎬 流媒体
  - RULE-SET,onedrive_domain,🚀 节点选择
  - RULE-SET,microsoft_domain,🚀 节点选择
  - RULE-SET,tiktok_domain,🚀 节点选择
  - RULE-SET,speedtest_domain,✈️ Speedtest
  - RULE-SET,telegram_domain,🎬 流媒体
  - RULE-SET,netflix_domain,🚀 节点选择
  - RULE-SET,paypal_domain,🚀 节点选择
  - RULE-SET,geolocation-!cn,🚀 节点选择
  - RULE-SET,cn_domain,🎯 全球直连
  - RULE-SET,google_ip,🎬 流媒体,no-resolve
  - RULE-SET,twitter_ip,🎬 流媒体,no-resolve
  - RULE-SET,netflix_ip,🚀 节点选择,no-resolve
  - RULE-SET,telegram_ip,🎬 流媒体,no-resolve
  - RULE-SET,cn_ip,🎯 全球直连
  - MATCH,🐟 漏网之鱼
rule-anchor:
  ip: &ip {type: http, interval: 86400, behavior: ipcidr, format: mrs}
  domain: &domain {type: http, interval: 86400, behavior: domain, format: mrs}
  class: &class {type: http, interval: 86400, behavior: classical, format: text}
rule-providers: 
  # ══ 自建规则集（本仓库 rules/ 目录，由你自己维护）══
  direct1:     { <<: *class, url: "https://raw.githubusercontent.com/jldxnb/openclash-rules/main/rules/DirectOwn.list" }
  ai:          { <<: *class, url: "https://raw.githubusercontent.com/jldxnb/openclash-rules/main/rules/AI.list" }
