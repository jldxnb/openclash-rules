name: update-manga-rules

# 每天把 v2fly/domain-list-community 的漫画相关域名增量同步进
# rules/MangaCN.list 与 rules/MangaProxy.list 的「自动同步区」（手工维护区不动），
# 然后重新生成对应的 mrs/MangaCN.mrs、mrs/MangaProxy.mrs 与
# rules/MangaCN.rest.list、rules/MangaProxy.rest.list（配置引用的就是这些产物）。
# 有变化才提交；拉上游失败则不写不提交（避免把网络故障当成“域名消失”误删条目）。
# 脚本：scripts/gen_manga_rules.py + scripts/gen_mrs.py（本地手动跑同样两条命令）。

on:
  schedule:
    # 每天 UTC 22:30 = 北京时间 06:30（避开整点调度高峰；GitHub 定时任务偶有延迟）
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-manga-rules
  cancel-in-progress: false

jobs:
  update:
    name: 同步漫画规则集
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 合并上游增量（写入自动同步区）
        run: |
          set -o pipefail
          python scripts/gen_manga_rules.py --apply | tee "$RUNNER_TEMP/manga-report.txt"

      - name: 重新生成 mrs（list 变了 mrs 就得跟着变）
        run: |
          set -o pipefail
          python scripts/gen_mrs.py | tee "$RUNNER_TEMP/mrs-report.txt"

      - name: 自检（0 错误才继续）
        run: |
          python -m pip install --quiet pyyaml
          python scripts/validate.py
          python scripts/gen_mrs.py --check

      - name: 有变化才提交推送
        run: |
          if git diff --quiet -- rules/MangaCN.list rules/MangaProxy.list; then
            echo "上游无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/MangaCN.list rules/MangaProxy.list \
                  rules/MangaCN.rest.list rules/MangaProxy.rest.list \
                  mrs/MangaCN.mrs mrs/MangaProxy.mrs
          {
            echo "chore(manga): 每日同步上游漫画域名并重建 mrs（$(date -u +%F)）"
            echo
            echo "自动合并 v2fly/domain-list-community 的漫画相关域名增量到两个清单的自动同步区；手工维护区未改动。报告："
            echo
            echo '```'
            cat "$RUNNER_TEMP/manga-report.txt"
            cat "$RUNNER_TEMP/mrs-report.txt"
            echo '```'
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          # 万一有人在任务运行期间推送过，先 rebase 再推，避免 non-fast-forward 失败
          git pull --rebase --autostash
          git push
