name: update-rules

# 每天把上游的域名增量同步进自建清单的「自动同步区」（手工维护区不动），并重建产物：
#   - rules/MangaCN.list / MangaProxy.list ← v2fly/domain-list-community 的漫画相关 data 文件
#   - rules/AnimeProxy.list ← FMHY 的 Anime Streaming / Downloading / Torrenting / Tracking 小节
#     （AnimeCN.list 是国内平台域名，稳定，不设自动上游）
# 之后重新生成 mrs/*.mrs 与 rules/*.rest.list（配置引用的就是这些产物）。
# 有变化才提交；上游拉取失败、或自动区条目数骤降（疑似上游改版）时都不写不提交。
# 脚本：scripts/gen_manga_rules.py + scripts/gen_anime_rules.py + scripts/gen_mrs.py。

on:
  schedule:
    # 每天 UTC 22:30 = 北京时间 06:30（避开整点调度高峰；GitHub 定时任务偶有延迟）
    - cron: "30 22 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-rules
  cancel-in-progress: false

jobs:
  update:
    name: 同步自建清单
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: 合并上游增量（写入各清单的自动同步区）
        run: |
          set -o pipefail
          {
            python scripts/gen_manga_rules.py --apply
            echo
            python scripts/gen_anime_rules.py --apply
          } | tee "$RUNNER_TEMP/rules-report.txt"

      - name: 重新生成 mrs（list 变了 mrs 就得跟着变）
        run: |
          set -o pipefail
          python scripts/gen_mrs.py | tee "$RUNNER_TEMP/mrs-report.txt"

      - name: 自检（0 错误才继续）
        run: |
          python -m pip install --quiet pyyaml
          python scripts/validate.py
          python scripts/gen_mrs.py --check

      - name: 有变化才提交推送
        run: |
          if git diff --quiet -- rules/ mrs/; then
            echo "上游无变化，跳过提交"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add rules/ mrs/
          {
            echo "chore(rules): 每日同步上游域名并重建 mrs（$(date -u +%F)）"
            echo
            echo "自动合并上游增量到自建清单的自动同步区（漫画=v2fly，动漫=FMHY），并重建 mrs / rest 产物；手工维护区未改动。报告："
            echo
            echo '```'
            cat "$RUNNER_TEMP/rules-report.txt"
            cat "$RUNNER_TEMP/mrs-report.txt"
            echo '```'
          } > "$RUNNER_TEMP/commit-msg.txt"
          git commit -F "$RUNNER_TEMP/commit-msg.txt"
          # 万一有人在任务运行期间推送过，先 rebase 再推，避免 non-fast-forward 失败
          git pull --rebase --autostash
          git push
